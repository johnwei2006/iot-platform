server:
  port: 8081

spring:
  application:
    name: platform-java
  # 业务主库为 MySQL（MyBatis-Plus）；TDengine 的 JdbcTemplate 由 TdEngineConfig 手工创建，
  # 仅排除 JdbcTemplate 自动配置，保留 DataSourceAutoConfiguration 给 MySQL 使用。
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.JdbcTemplateAutoConfiguration
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:iot-platform}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:jwmhw5154}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    # 设备实时状态缓存。Lettuce 为懒连接，未部署 Redis 时应用仍可启动。
    # （Spring Boot 3 起 Redis 连接属性由 spring.redis 迁移到 spring.data.redis）
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: ${REDIS_TIMEOUT:2000}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    listener:
      simple:
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000
          multiplier: 2.0
          max-interval: 10000
        default-requeue-rejected: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      # 主键由应用层显式赋值（UUID 或迁移保留的历史 id）
      id-type: none

app:
  # 鉴权（阶段 3）：优先本地验签——从 auth-service JWKS 拉取 RS256 公钥，
  # 本地完成签名/过期/iss/aud 校验 + Redis 撤销检查（内存短缓存）；
  # 公钥未就绪时自动回退远程 /api/auth/verify（fail-closed）。
  auth-service:
    base-url: ${AUTH_SERVICE_BASE_URL:http://localhost:8083}
    verify-path: ${AUTH_SERVICE_VERIFY_PATH:/api/auth/verify}
    connect-timeout-ms: ${AUTH_SERVICE_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${AUTH_SERVICE_READ_TIMEOUT_MS:2000}
  auth:
    local:
      # JWKS 地址；留空使用 base-url + /.well-known/jwks.json
      jwks-url: ${AUTH_JWKS_URL:}
      # JWKS 刷新间隔（毫秒），即密钥轮换生效上限
      refresh-ms: ${AUTH_JWKS_REFRESH_MS:300000}
      # 可选静态 PEM 公钥兜底（X.509 SubjectPublicKeyInfo，openssl rsa -pubout 输出）
      static-public-key: ${AUTH_JWT_PUBLIC_KEY:}
      static-key-id: ${AUTH_JWT_PUBLIC_KEY_ID:auth-key-1}
      # 与 auth-service 的 AUTH_JWT_ISSUER / AUTH_JWT_AUDIENCE 保持一致
      issuer: ${AUTH_JWT_ISSUER:iot-auth}
      audience: ${AUTH_JWT_AUDIENCE:iot-platform}
      revocation:
        # 关闭后仅依赖签名+版本过期，建议生产保持开启
        enabled: ${AUTH_REVOCATION_CHECK:true}
        # 与 auth-service 的 AUTH_REDIS_PREFIX 一致（共享 Redis）
        redis-prefix: ${AUTH_REDIS_PREFIX:auth:}
        # 撤销状态内存缓存 TTL（毫秒）：撤销生效延迟上限
        cache-ttl-ms: ${AUTH_REVOCATION_CACHE_TTL_MS:15000}
        # true：Redis 不可用时放行并告警；false：返回 503
        fail-open: ${AUTH_REVOCATION_FAIL_OPEN:true}
  mq:
    exchange: iot.exchange
    platform-uplink: platform.uplink
    platform-downlink: platform.downlink

# 传感器时序数据（TDengine）。连接参数直接在配置文件中提供默认值，
# 需要时可用同名环境变量覆盖；口令不写日志。
# 默认 enabled=true 但采用懒连接：无时序库时应用仍可启动，写入失败只告警不影响上行 ACK。
tdengine:
  enabled: ${TDENGINE_ENABLED:true}
  host: ${TDENGINE_HOST:47.104.160.158}
  port: ${TDENGINE_PORT:6041}
  # true 走 REST JDBC(TAOS-RS, 6041)；false 走原生 JDBC(TAOS, 6030)
  rest: ${TDENGINE_REST:true}
  username: ${TDENGINE_USER:kebai}
  password: ${TDENGINE_PASSWORD:Caipos010}
  database: ${TDENGINE_DATABASE:iot}
  stable: sensordata
  # 传感器类型码 -> 单位；未配置的类型使用空串
  unit-by-sensor-type:
    "1": "C"
    "2": "%"
    "3": "hPa"

# 设备实时状态（Redis String JSON + TTL）。TTL 过期即视为 OFFLINE，不做定时离线扫描。
# 默认 enabled=true 但写入失败只告警，不影响上行 ACK；口令不写日志。
realtime:
  enabled: ${REDIS_ENABLED:true}
  ttl-seconds: ${REDIS_TTL_SECONDS:120}
  key-prefix: ${REDIS_KEY_PREFIX:device:status:}
  max-json-bytes: ${REDIS_MAX_JSON_BYTES:8192}
  scan-count: ${REDIS_SCAN_COUNT:200}
  max-list-size: ${REDIS_MAX_LIST_SIZE:1000}

logging:
  level:
    com.iot.platform: info
