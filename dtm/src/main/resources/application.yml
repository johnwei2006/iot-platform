server:
  port: 8082

spring:
  application:
    name: dtm
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/iot_host}
    # 发布确认：MessagePublisher 等待 broker confirm 后再让消费者 ACK
    publisher-confirms: true
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        # 手动 ACK：由 UplinkConsumer/DownlinkConsumer 在 worker 完成后显式 ack/nack
        acknowledge-mode: manual
        prefetch: ${DTM_PREFETCH:32}
        concurrency: ${DTM_CONCURRENCY:8}
        max-concurrency: ${DTM_MAX_CONCURRENCY:32}
        default-requeue-rejected: false
        # 与手动 ACK 叠加会导致重复处理，失败统一由 Consumer 显式 nack 进 DLQ
        retry:
          enabled: false

# ===== 业务协议编解码 =====
# enabled=false 可一键回退为纯字节透传；fail-open=true 表示解码失败仍转发原报文（不丢消息）
dtm:
  protocol:
    enabled: ${DTM_PROTOCOL_ENABLED:true}
    fail-open: ${DTM_PROTOCOL_FAIL_OPEN:true}
    max-payload-bytes: 8192
    max-repeat-items: 256
  # 报文处理线程池与发布确认
  worker:
    core-size: ${DTM_WORKER_CORE:8}
    max-size: ${DTM_WORKER_MAX:32}
    queue-capacity: ${DTM_WORKER_QUEUE:1024}
    keep-alive-seconds: 60
    await-timeout-ms: ${DTM_WORKER_AWAIT_TIMEOUT_MS:60000}
    confirm-timeout-ms: ${DTM_CONFIRM_TIMEOUT_MS:10000}
    profile-cache-max: ${DTM_PROFILE_CACHE_MAX:10000}

logging:
  level:
    com.iot.dtm: info
