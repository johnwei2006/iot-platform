databaseChangeLog:
  - changeSet:
      id: 20261122-01-create-sys-management-tables
      author: iot-platform
      comment: 系统管理表基线（幂等建表，不影响已有数据）
      changes:
        - sqlFile:
            path: sql/001-create-sys-management-tables.sql
            relativeToChangelogFile: true
            endDelimiter: ;
            splitStatements: true
  - changeSet:
      id: 20261122-02-create-platform-tables
      author: iot-platform
      comment: platform_java 业务表基线（传感器时序数据仍在 TDengine）
      changes:
        - sqlFile:
            path: sql/002-create-platform-tables.sql
            relativeToChangelogFile: true
            endDelimiter: ;
            splitStatements: true
  - changeSet:
      id: 20261122-03-create-control-message-threshold-tables
      author: iot-platform
      comment: 控制规则/控制记录/测点阈值/任务/消息/通知偏好（设备控制与消息任务域）
      changes:
        - sqlFile:
            path: sql/003-create-control-message-threshold-tables.sql
            relativeToChangelogFile: true
            endDelimiter: ;
            splitStatements: true
  - changeSet:
      id: 20261122-04-control-rule-metric-device-and-log-channel
      author: iot-platform
      comment: 条件规则补充取数传感器设备；控制记录补充 nodeId/channel 供 0x1A 回报匹配
      preConditions:
        - onFail: MARK_RAN
        - onError: MARK_RAN
        - not:
            columnExists:
              tableName: iot_control_rule
              columnName: metric_device_id
      changes:
        - sql: >
            ALTER TABLE `iot_control_rule`
              ADD COLUMN `metric_device_id` VARCHAR(128) DEFAULT NULL COMMENT '条件规则：取数传感器设备编号（station deviceId）' AFTER `metric`;
  - changeSet:
      id: 20261122-05-control-log-node-channel
      author: iot-platform
      comment: 控制记录补充 node_id/channel 以匹配 0x1A 设备控制反馈
      preConditions:
        - onFail: MARK_RAN
        - onError: MARK_RAN
        - not:
            columnExists:
              tableName: iot_control_log
              columnName: node_id
      changes:
        - sql: >
            ALTER TABLE `iot_control_log`
              ADD COLUMN `node_id` VARCHAR(128) DEFAULT NULL COMMENT '受控执行节点' AFTER `device_id`,
              ADD COLUMN `channel` INT DEFAULT NULL COMMENT '受控通道（0x1A 回报匹配）' AFTER `node_id`;
  - changeSet:
      id: 20261122-06-product-org-authorization
      author: iot-platform
      comment: 产品、产品-菜单、机构-产品授权表与预置产品
      changes:
        - sqlFile:
            path: sql/006-create-product-org-tables.sql
            relativeToChangelogFile: true
            endDelimiter: ;
            splitStatements: true
  - changeSet:
      id: 20261126-07-migrate-iot-device-to-gateway
      author: iot-platform
      comment: iot_device 迁移为 iot_gateway（device_id->gateway_code，追加网关扩展字段），旧表保留备份
      changes:
        - sqlFile:
            path: sql/007-migrate-iot-device-to-gateway.sql
            relativeToChangelogFile: true
            endDelimiter: ;
            splitStatements: true
  - changeSet:
      id: 20261126-08-create-node-sensor-device-tables
      author: iot-platform
      comment: 三层架构表：节点/传感器/控制设备及其分类字典表 + 常用种子 + 用户数据权限补值
      changes:
        - sqlFile:
            path: sql/008-create-node-sensor-device-tables.sql
            relativeToChangelogFile: true
            endDelimiter: ;
            splitStatements: true
  - changeSet:
      id: 20261126-09-create-sensor-group-table
      author: iot-platform
      comment: 传感器组合：图表/表格数据页的测点分组
      changes:
        - sqlFile:
            path: sql/009-create-sensor-group-table.sql
            relativeToChangelogFile: true
            endDelimiter: ;
            splitStatements: true
