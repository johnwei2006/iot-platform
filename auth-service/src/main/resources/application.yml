server:
  port: ${AUTH_PORT:8083}

spring:
  application:
    name: auth-service
  # 用户表 sys_user 在 MySQL；审计/SSO/refresh 仍在 MongoDB
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:iot-platform}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:jwmhw5154}
    driver-class-name: com.mysql.cj.jdbc.Driver
  # sys_user 表结构由共享 Liquibase changelog 管理；审计/SSO 仍在 MongoDB
  liquibase:
    enabled: ${LIQUIBASE_ENABLED:true}
    change-log: classpath:db/changelog/db.changelog-master.yaml
    drop-first: false
  data:
    mongodb:
      uri: ${AUTH_MONGO_URI:mongodb://localhost:27017/auth_service}
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: ${REDIS_TIMEOUT:2000}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      # 主键由应用层显式赋值（UUID 或迁移保留的历史 id）
      id-type: none

management:
  endpoints:
    web:
      exposure:
        include: health,info

# 认证中心配置。签名二选一：
#   RS256（推荐）：AUTH_JWT_PRIVATE_KEY 注入 PKCS#8 PEM 私钥（openssl genpkey -algorithm RSA），
#                 下游经 /.well-known/jwks.json 本地验签，kid 支持平滑轮换；
#   HS256（兼容）：AUTH_JWT_SECRET 注入至少 32 字符随机密钥。
auth:
  jwt-secret: ${AUTH_JWT_SECRET:}
  jwt-private-key: ${AUTH_JWT_PRIVATE_KEY:}
  jwt-key-id: ${AUTH_JWT_KEY_ID:auth-key-1}
  jwt-issuer: ${AUTH_JWT_ISSUER:iot-auth}
  jwt-audience: ${AUTH_JWT_AUDIENCE:iot-platform}
  rate-limit:
    enabled: ${AUTH_RATE_LIMIT_ENABLED:true}
    max-failures: ${AUTH_RATE_LIMIT_MAX_FAILURES:10}
    window-ms: ${AUTH_RATE_LIMIT_WINDOW_MS:900000}
  access-ttl-ms: ${AUTH_ACCESS_TTL_MS:1800000}
  refresh-ttl-ms: ${AUTH_REFRESH_TTL_MS:604800000}
  ticket-ttl-ms: ${AUTH_TICKET_TTL_MS:300000}
  redis-prefix: ${AUTH_REDIS_PREFIX:auth:}
  # Refresh Token HttpOnly Cookie。生产 HTTPS 环境将 AUTH_COOKIE_SECURE 置为 true；
  # 跨域无法携带 Cookie 时可整体关闭（AUTH_COOKIE_ENABLED=false），退回 body 模式。
  cookie:
    enabled: ${AUTH_COOKIE_ENABLED:true}
    name: ${AUTH_COOKIE_NAME:auth_refresh}
    path: ${AUTH_COOKIE_PATH:/api/auth}
    domain: ${AUTH_COOKIE_DOMAIN:}
    secure: ${AUTH_COOKIE_SECURE:false}
    same-site: ${AUTH_COOKIE_SAMESITE:Strict}
  # SSO 中央会话（统一登录页 /sso/login）。生产 HTTPS 环境将 AUTH_SSO_SESSION_COOKIE_SECURE 置 true。
  sso:
    session-enabled: ${AUTH_SSO_SESSION_ENABLED:true}
    session-ttl-ms: ${AUTH_SSO_SESSION_TTL_MS:28800000}
    session-cookie-name: ${AUTH_SSO_SESSION_COOKIE_NAME:auth_sso}
    session-cookie-domain: ${AUTH_SSO_SESSION_COOKIE_DOMAIN:}
    session-cookie-secure: ${AUTH_SSO_SESSION_COOKIE_SECURE:false}
    session-cookie-same-site: ${AUTH_SSO_SESSION_COOKIE_SAMESITE:Lax}
  clients:
    - id: web
      secret: ${AUTH_CLIENT_WEB_SECRET:web-client-secret-change-me}
      redirect-uris:
        - ${AUTH_WEB_REDIRECT_URI:http://localhost:5173/sso/callback}
    - id: app
      secret: ${AUTH_CLIENT_APP_SECRET:app-client-secret-change-me}
      redirect-uris:
        - ${AUTH_APP_REDIRECT_URI:myapp://sso/callback}
    - id: mini
      secret: ${AUTH_CLIENT_MINI_SECRET:mini-client-secret-change-me}
      redirect-uris:
        - ${AUTH_MINI_REDIRECT_URI:mini://sso/callback}
  service-keys:
    - id: platform_java
      secret: ${AUTH_SERVICE_PLATFORM_SECRET:platform-service-secret-change-me}
    - id: dtm
      secret: ${AUTH_SERVICE_DTM_SECRET:dtm-service-secret-change-me}
    - id: proxytcp
      secret: ${AUTH_SERVICE_PROXY_SECRET:proxy-service-secret-change-me}
    - id: admin_service
      secret: ${AUTH_SERVICE_ADMIN_SECRET:iot-admin-internal-secret}
  wechat:
    app-id: ${WECHAT_APPID:}
    app-secret: ${WECHAT_APPSECRET:}
