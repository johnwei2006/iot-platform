<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>统一账号登录</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    display: flex; justify-content: center; align-items: center;
    min-height: 100vh;
    background: linear-gradient(135deg, #eef2f7 0%, #dce8fb 100%);
  }
  .card {
    width: 400px; max-width: 92vw;
    background: #fff; border-radius: 14px;
    box-shadow: 0 12px 40px rgba(31, 45, 61, 0.12);
    padding: 36px 32px;
  }
  .title { font-size: 20px; font-weight: 600; color: #303133; text-align: center; }
  .subtitle { font-size: 13px; color: #909399; text-align: center; margin-top: 6px; }
  .field { margin-top: 20px; }
  .field label { display: block; font-size: 13px; color: #606266; margin-bottom: 6px; }
  .field input {
    width: 100%; height: 40px; padding: 0 12px;
    border: 1px solid #dcdfe6; border-radius: 6px; font-size: 14px;
    outline: none; transition: border-color .2s;
  }
  .field input:focus { border-color: #409eff; }
  .btn {
    width: 100%; height: 42px; margin-top: 24px;
    background: #409eff; color: #fff; border: none; border-radius: 6px;
    font-size: 15px; letter-spacing: 2px; cursor: pointer;
  }
  .btn:disabled { opacity: .6; cursor: not-allowed; }
  .msg { margin-top: 16px; font-size: 13px; text-align: center; min-height: 18px; }
  .msg.error { color: #f56c6c; }
  .msg.info { color: #909399; }
  .status { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 28px 0; color: #606266; }
  .spinner {
    width: 30px; height: 30px; border: 3px solid #dce8fb;
    border-top-color: #409eff; border-radius: 50%;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .hidden { display: none; }
</style>
</head>
<body>
  <div class="card">
    <div class="title">IoT 平台统一账号</div>
    <div class="subtitle">一次登录，多端免密</div>

    <!-- 状态：会话检测 / 跳转中 -->
    <div id="status" class="status">
      <div class="spinner"></div>
      <div id="statusText">正在检测登录状态...</div>
    </div>

    <!-- 登录表单 -->
    <form id="form" class="hidden" onsubmit="return handleLogin(event)">
      <div class="field">
        <label for="username">用户名</label>
        <input id="username" type="text" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="password">密码</label>
        <input id="password" type="password" autocomplete="current-password" required>
      </div>
      <button id="btn" class="btn" type="submit">登 录</button>
      <div id="msg" class="msg"></div>
    </form>
  </div>

<script>
  var params = new URLSearchParams(window.location.search);
  var clientId = params.get('clientId') || 'web';
  var redirectUri = params.get('redirectUri') || '';
  var redirect = params.get('redirect') || '';

  function setStatus(text) {
    document.getElementById('statusText').textContent = text;
  }
  function showError(text) {
    document.getElementById('status').classList.add('hidden');
    document.getElementById('form').classList.remove('hidden');
    var msg = document.getElementById('msg');
    msg.textContent = text;
    msg.className = 'msg error';
  }
  function apiError(json, res) {
    return (json && json.message) || (res && res.statusText) || '请求失败';
  }

  async function requestTicket() {
    setStatus('正在跳转回客户端...');
    var res = await fetch('/api/sso/ticket', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ clientId: clientId, redirectUri: redirectUri })
    });
    var json = await res.json().catch(function () { return null; });
    if (!res.ok || !json || (json.code !== 200 && json.code !== 0)) {
      showError('签发票据失败：' + apiError(json, res));
      return;
    }
    var target = new URL(redirectUri, window.location.origin);
    target.searchParams.set('ticket', json.data.ticket);
    if (redirect) target.searchParams.set('redirect', redirect);
    window.location.replace(target.toString());
  }

  async function handleLogin(event) {
    event.preventDefault();
    var btn = document.getElementById('btn');
    var msg = document.getElementById('msg');
    btn.disabled = true;
    msg.textContent = '';
    try {
      var res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: document.getElementById('username').value.trim(),
          password: document.getElementById('password').value,
          clientId: clientId
        })
      });
      var json = await res.json().catch(function () { return null; });
      if (!res.ok || !json || (json.code !== 200 && json.code !== 0)) {
        msg.textContent = apiError(json, res);
        msg.className = 'msg error';
        return false;
      }
      await requestTicket();
    } finally {
      btn.disabled = false;
    }
    return false;
  }

  (async function boot() {
    if (!redirectUri) {
      showError('缺少 redirectUri 参数，无法完成登录跳转');
      return;
    }
    try {
      var res = await fetch('/api/sso/session');
      var json = await res.json();
      if (json && json.data && json.data.authenticated) {
        await requestTicket();
      } else {
        document.getElementById('status').classList.add('hidden');
        document.getElementById('form').classList.remove('hidden');
        document.getElementById('username').focus();
      }
    } catch (e) {
      showError('认证服务不可用，请稍后重试');
    }
  })();
</script>
</body>
</html>
