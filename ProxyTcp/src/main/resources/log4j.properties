log4j.rootLogger = INFO, console,D,E
log4j.logger.D = D
log4j.logger.E = E
#log4j.logger.failedDownlinkLog = failedDownlink
#log4j.additivity.failedDownlinkLog = false    

log4j.appender.console = org.apache.log4j.ConsoleAppender
log4j.appender.console.Threshold=INFO
log4j.appender.console.ImmediateFlush=true
log4j.appender.console.Target = System.out
log4j.appender.console.layout = org.apache.log4j.PatternLayout
log4j.appender.console.layout.ConversionPattern=[%-5p] %d(%r) --> [%t] %l: %m %x %n

#log file
log4j.appender.D = org.apache.log4j.DailyRollingFileAppender
log4j.appender.D.File = /data/logs/proxytcp.log
log4j.appender.D.Append = true
log4j.appender.D.Threshold = INFO
log4j.appender.D.layout = org.apache.log4j.PatternLayout
log4j.appender.D.layout.ConversionPattern = %-d{yyyy-MM-dd HH:mm:ss}  [ %t:%r ] - [ %p ]  %m%n

#error file
log4j.appender.E = org.apache.log4j.DailyRollingFileAppender
log4j.appender.E.File = /data/logs/proxytcp_error.log
log4j.appender.E.Append = true
log4j.appender.E.Threshold = ERROR
log4j.appender.E.layout = org.apache.log4j.PatternLayout
log4j.appender.E.layout.ConversionPattern = %-d{yyyy-MM-dd HH:mm:ss}  [ %t:%r ] - [ %p ]  %m%n

#failedDownlink message file
log4j.appender.failedDownlink = org.apache.log4j.RollingFileAppender  
log4j.appender.failedDownlink.File = /data/logs/failedDownlinkMessages.log
log4j.appender.failedDownlink.Append = true
log4j.appender.failedDownlink.Threshold = ERROR
log4j.appender.failedDownlink.layout = org.apache.log4j.PatternLayout
log4j.appender.failedDownlink.layout.ConversionPattern = %-d{yyyy-MM-dd HH:mm:ss}  [ %t:%r ] - [ %p ]  %m%n
log4j.appender.failedDownlink.MaxFileSize=5MB
log4j.appender.failedDownlink.MaxBackupIndex=100
